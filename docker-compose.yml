name: sd-sistema-academico

services:
  postgres-registro:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academico}
      POSTGRES_DB: registro_db
    volumes:
      - pgdata-registro:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d registro_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-matricula:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academico}
      POSTGRES_DB: matricula_db
    volumes:
      - pgdata-matricula:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d matricula_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  registro-service:
    build:
      context: .
      dockerfile: services/registro-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-academico}:${POSTGRES_PASSWORD:-academico}@postgres-registro:5432/registro_db
      GRPC_PORT: 50052
    depends_on:
      postgres-registro:
        condition: service_healthy

  matricula-service:
    build:
      context: .
      dockerfile: services/matricula-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-academico}:${POSTGRES_PASSWORD:-academico}@postgres-matricula:5432/matricula_db
      GRPC_PORT: 50051
      REGISTRO_GRPC_URL: ${REGISTRO_GRPC_URL:-registro-service:50052}
    depends_on:
      postgres-matricula:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja o .env.example)}
      APP_PASSWORD: ${APP_PASSWORD:-sd2026}
      REGISTRO_GRPC_URL: ${REGISTRO_GRPC_URL:-registro-service:50052}
      MATRICULA_GRPC_URL: ${MATRICULA_GRPC_URL:-matricula-service:50051}
      GRPC_DEADLINE_MS: 8000
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      GATEWAY_HOST: ${GATEWAY_HOST:-api-gateway:3000}
    ports:
      - "8080:80"

volumes:
  pgdata-registro:
  pgdata-matricula:
